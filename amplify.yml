version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        # The public app owns the backend. The admin app points at the same
        # backend and only pulls its outputs, so the two never fight over
        # deploying the same stack. Set BACKEND_APP_ID on the admin app.
        - |
          if [ "$BUILD_TARGET" = "build:admin" ]; then
            npx ampx generate outputs --branch "$AWS_BRANCH" --app-id "$BACKEND_APP_ID"
          else
            npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
          fi
frontend:
  phases:
    build:
      commands:
        - npm run ${BUILD_TARGET:-build}
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*

  customHeaders:
    # Vite fingerprints these filenames, so they can be cached indefinitely.
    - pattern: '/assets/**'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
    # The entry document must always be revalidated or users get a stale app.
    - pattern: '/index.html'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=0, must-revalidate'
    - pattern: '/*.@(webp|png|jpg|jpeg|svg|mp4|woff2)'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=604800'
    - pattern: '**/*'
      headers:
        - key: 'X-Content-Type-Options'
          value: 'nosniff'
        - key: 'X-Frame-Options'
          value: 'SAMEORIGIN'
        - key: 'Referrer-Policy'
          value: 'strict-origin-when-cross-origin'
        - key: 'Strict-Transport-Security'
          value: 'max-age=31536000; includeSubDomains'

  # React Router owns client-side routing; everything that is not a real file
  # falls through to the SPA shell.
  rewrites:
    - source: '/<*>'
      target: '/index.html'
      status: '404-200'
